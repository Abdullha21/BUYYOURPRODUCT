<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Premium Store | Live Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #000000;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ff6b35, #feca57);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: #888;
            margin-top: 5px;
        }

        /* Banner Slider */
        .banner-wrapper {
            margin-bottom: 40px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .swiper {
            border-radius: 20px;
        }

        .swiper-slide img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #ff6b35;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .swiper-pagination-bullet-active {
            background: #ff6b35;
        }

        /* Section Title */
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 35px 0 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Today Stats Box */
        .stats-box {
            background: linear-gradient(135deg, #1e1e2f, #0a0a12);
            border-radius: 24px;
            padding: 20px 25px;
            margin: 20px 0 30px;
            border: 1px solid rgba(255,107,53,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.5);
            padding: 12px 24px;
            border-radius: 60px;
            flex: 1;
            min-width: 180px;
            justify-content: center;
        }

        .stats-icon {
            font-size: 2rem;
            color: #feca57;
        }

        .stats-info h3 {
            font-size: 0.85rem;
            font-weight: 500;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .stats-number {
            font-size: 2rem;
            font-weight: 800;
            color: #ff6b35;
            line-height: 1;
        }

        .stats-label {
            font-size: 0.7rem;
            color: #feca57;
            margin-left: 5px;
            font-weight: 500;
        }

        /* Products Grid - 2 per row EXACTLY */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Product Cards */
        .product-card {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,107,53,0.3);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b35;
            background: linear-gradient(135deg, #222, #15152a);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .product-icon {
            font-size: 2.5rem;
            color: #ff6b35;
            margin-bottom: 12px;
        }

        .product-card h3 {
            font-size: 1.2rem;
            color: white;
            margin-bottom: 5px;
        }

        .product-card p {
            color: #999;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .price {
            font-weight: 800;
            font-size: 1.3rem;
            color: #feca57;
        }

        /* Premium Badge */
        .premium-badge {
            display: inline-block;
            background: #ff6b35;
            color: white;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .premium-plus-badge {
            background: #feca57;
            color: #000;
        }

        /* Contact Buttons - 3 buttons in 1 line */
        .contact-section {
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
            padding: 25px;
            margin: 35px 0;
        }

        .contact-title {
            font-size: 1.2rem;
            margin-bottom: 18px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-buttons {
            display: flex;
            flex-wrap: nowrap;
            gap: 15px;
            justify-content: center;
        }

        .contact-btn {
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            flex: 1;
            justify-content: center;
            max-width: 200px;
        }

        .contact-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
        }

        .twitter-btn {
            background: #1DA1F2;
            color: white;
        }

        .telegram-btn {
            background: #0088cc;
            color: white;
        }

        @media (max-width: 650px) {
            .contact-buttons {
                flex-wrap: wrap;
            }
            .contact-btn {
                max-width: none;
                flex: auto;
            }
            .stats-box {
                flex-direction: column;
                align-items: stretch;
            }
            .stats-item {
                justify-content: flex-start;
            }
        }

        /* Order History */
        .history-card {
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
            padding: 25px;
            margin-top: 20px;
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .order-item {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-left: 4px solid #ff6b35;
            transition: 0.2s;
        }

        .order-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .order-id {
            font-weight: 700;
            color: #ff6b35;
            font-size: 0.85rem;
            background: rgba(255,107,53,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .complete-badge {
            background: #00b894;
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 600;
            margin-left: 8px;
        }

        .order-product {
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
        }

        .order-date {
            color: #888;
            font-size: 0.7rem;
        }

        .order-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #bbb;
        }

        .twitter-link {
            color: #1da1f2;
            text-decoration: none;
            word-break: break-all;
        }
        
        .twitter-link:hover {
            text-decoration: underline;
        }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .footer {
            text-align: center;
            margin-top: 45px;
            padding: 20px;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> Premium Store</h1>
        <p>Live Order History | Instant Updates</p>
    </div>

    <!-- Banner Slider -->
    <div class="banner-wrapper">
        <div class="swiper bannerSwiper">
            <div class="swiper-wrapper" id="bannerSlider"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <!-- TODAY STATS BOX: Total Completed Orders (Count & Total Pieces/Months) -->
    <div class="stats-box" id="todayStatsBox">
        <div class="stats-item">
            <div class="stats-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stats-info">
                <h3>Today Completed Orders</h3>
                <div><span class="stats-number" id="todayOrdersCount">0</span><span class="stats-label">orders</span></div>
            </div>
        </div>
        <div class="stats-item">
            <div class="stats-icon"><i class="fas fa-boxes"></i></div>
            <div class="stats-info">
                <h3>Total Pieces (Months)</h3>
                <div><span class="stats-number" id="todayTotalPieces">0</span><span class="stats-label">months</span></div>
            </div>
        </div>
    </div>

    <!-- Premium Products Section -->
    <div class="section-title">
        <i class="fas fa-gem"></i> Premium Products (Click to Order via WhatsApp)
    </div>
    <div class="products-grid" id="productsGrid">
        <div class="empty-msg" style="grid-column:1/-1;">Loading products...</div>
    </div>

    <!-- Contact Buttons - 3 buttons 1 line -->
    <div class="contact-section">
        <div class="contact-title">
            <i class="fas fa-headset"></i> 24/7 Support
        </div>
        <div class="contact-buttons" id="contactButtons">
            <div class="empty-msg">Loading contacts...</div>
        </div>
    </div>

    <!-- Live Order History -->
    <div class="section-title">
        <i class="fas fa-history"></i> Live Order History (Last 15 Orders)
    </div>
    <div class="history-card">
        <div class="history-list" id="orderHistoryList">
            <div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>
        </div>
    </div>

    <div class="footer">
        Developed by Abdullah Khan
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCQW9wJme2hCnGqaSocSyMZriz0AtWEKsU",
        authDomain: "premium-store-17a23.firebaseapp.com",
        projectId: "premium-store-17a23",
        storageBucket: "premium-store-17a23.firebasestorage.app",
        messagingSenderId: "1068634444182",
        appId: "1:1068634444182:web:55bc823641dede5e948db7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let swiper = null;
    let whatsappNumber = '';

    // Load Banners
    function loadBanners() {
        db.ref('banners').on('value', (snapshot) => {
            const banners = snapshot.val();
            const wrapper = document.getElementById('bannerSlider');
            
            if (!banners || Object.keys(banners).length === 0) {
                wrapper.innerHTML = `<div class="swiper-slide">
                    <div style="width:100%; height:320px; background:linear-gradient(135deg,#ff6b35,#feca57); display:flex;align-items:center;justify-content:center;color:white;font-size:1.5rem;">
                        <i class="fas fa-store"></i> Premium Store
                    </div>
                </div>`;
            } else {
                let html = '';
                for (let key in banners) {
                    if (banners[key].url) {
                        html += `<div class="swiper-slide">
                            <img src="${banners[key].url}" alt="Banner" onerror="this.src='https://via.placeholder.com/1200x400?text=Image+Error'">
                        </div>`;
                    }
                }
                if (html === '') {
                    html = `<div class="swiper-slide"><div style="height:320px; background:#333; display:flex;align-items:center;justify-content:center;color:white;">No Banner</div></div>`;
                }
                wrapper.innerHTML = html;
            }
            
            setTimeout(() => {
                if (swiper) swiper.destroy(true, true);
                swiper = new Swiper('.bannerSwiper', {
                    loop: true,
                    autoplay: { delay: 4000, disableOnInteraction: false },
                    navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                    pagination: { el: '.swiper-pagination', clickable: true }
                });
            }, 100);
        });
    }

    // Load Products
    function loadProducts() {
        db.ref('products').on('value', (snapshot) => {
            const products = snapshot.val();
            const grid = document.getElementById('productsGrid');
            
            if (!products || Object.keys(products).length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#888;">No products available. Add from Admin Panel.</div>';
                return;
            }
            
            let html = '';
            for (let key in products) {
                const p = products[key];
                const isPremiumPlus = p.name && p.name.toLowerCase().includes('plus');
                const badgeClass = isPremiumPlus ? 'premium-plus-badge' : '';
                const badgeText = isPremiumPlus ? 'PREMIUM PLUS' : 'PREMIUM';
                
                html += `
                    <div class="product-card" data-name="${(p.name || 'Product').replace(/"/g, '&quot;')}" data-price="${p.price || 0}">
                        <div class="premium-badge ${badgeClass}">${badgeText}</div>
                        <div class="product-icon"><i class="${p.icon || 'fab fa-twitter'}"></i></div>
                        <h3>${p.name || 'Product'}</h3>
                        <p>${p.description || 'Premium Service'}</p>
                        <div class="price">$${p.price || 0}</div>
                    </div>
                `;
            }
            grid.innerHTML = html;
            
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', () => {
                    const name = card.dataset.name;
                    const price = card.dataset.price;
                    const msg = `Hi! I want to order *${name}* for $${price}. Please confirm availability.`;
                    if (whatsappNumber && whatsappNumber !== '') {
                        let cleanNum = whatsappNumber.replace(/[^0-9]/g, '');
                        if (cleanNum.startsWith('0')) cleanNum = '88' + cleanNum.substring(1);
                        if (!cleanNum.startsWith('88')) cleanNum = '88' + cleanNum;
                        window.open(`https://wa.me/${cleanNum}?text=${encodeURIComponent(msg)}`, '_blank');
                    } else {
                        alert('WhatsApp number not configured yet. Please contact admin.');
                    }
                });
            });
        });
    }

    // Load Contact Buttons (Twitter link now shows only the link, no extra @ or username)
    function loadContactButtons() {
        db.ref('contact').on('value', (snapshot) => {
            const c = snapshot.val();
            const container = document.getElementById('contactButtons');
            
            let html = '';
            
            // WhatsApp button
            if (c && c.whatsapp) {
                whatsappNumber = c.whatsapp;
                let cleanNum = c.whatsapp.replace(/[^0-9]/g, '');
                if (cleanNum.startsWith('0')) cleanNum = '88' + cleanNum.substring(1);
                if (!cleanNum.startsWith('88')) cleanNum = '88' + cleanNum;
                html += `<a href="https://wa.me/${cleanNum}" target="_blank" class="contact-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
            } else {
                html += `<a href="#" class="contact-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
            }
            
            // Twitter button - ONLY the link from admin panel, no extra text like @username
            if (c && c.twitterLink && c.twitterLink !== '') {
                html += `<a href="${c.twitterLink}" target="_blank" class="contact-btn twitter-btn"><i class="fab fa-twitter"></i> Twitter</a>`;
            } else {
                html += `<a href="#" class="contact-btn twitter-btn"><i class="fab fa-twitter"></i> Twitter</a>`;
            }
            
            // Telegram button
            if (c && c.telegramLink && c.telegramLink !== '') {
                html += `<a href="${c.telegramLink}" target="_blank" class="contact-btn telegram-btn"><i class="fab fa-telegram"></i> Telegram</a>`;
            } else {
                html += `<a href="#" class="contact-btn telegram-btn"><i class="fab fa-telegram"></i> Telegram</a>`;
            }
            
            container.innerHTML = html;
        });
    }

    // Helper: Get today's start timestamp (00:00:00)
    function getTodayStart() {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        return now.getTime();
    }

    // Update today stats: total orders completed today & total pieces (sum of months)
    function updateTodayStats(ordersArray) {
        const todayStart = getTodayStart();
        const todayOrders = ordersArray.filter(order => (order.timestamp || 0) >= todayStart);
        const totalOrdersCount = todayOrders.length;
        
        let totalPieces = 0;
        todayOrders.forEach(order => {
            let months = parseInt(order.months);
            if (isNaN(months)) months = 1;
            totalPieces += months;
        });
        
        document.getElementById('todayOrdersCount').innerText = totalOrdersCount;
        document.getElementById('todayTotalPieces').innerText = totalPieces;
    }

    // Load Order History with COMPLETE badge next to Order ID
    // Twitter field: now only shows the raw link from database (no extra @ or username formatting)
    function loadOrderHistory() {
        db.ref('orders').orderByChild('timestamp').once('value', (snapshot) => {
            let orders = [];
            snapshot.forEach((child) => {
                const val = child.val();
                orders.push({ 
                    id: child.key, 
                    orderId: val.orderId || 'N/A',
                    productName: val.productName || 'Unknown',
                    premiumType: val.premiumType || 'Premium',
                    twitterId: val.twitterId || '',
                    months: val.months || 1,
                    amount: val.amount || 0,
                    timestamp: val.timestamp || Date.now()
                });
            });
            
            // Sort descending
            orders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            // Update Today Stats using full orders list (for accurate counting)
            updateTodayStats(orders);
            
            // Keep only last 15 for display, but auto-delete older ones if >15
            const displayOrders = orders.slice(0, 15);
            if (orders.length > 15) {
                const toDelete = orders.slice(15);
                toDelete.forEach(order => {
                    if (order.id) db.ref('orders/' + order.id).remove().catch(e => console.warn(e));
                });
            }
            
            const container = document.getElementById('orderHistoryList');
            if (displayOrders.length === 0) {
                container.innerHTML = '<div class="empty-msg"><i class="fas fa-inbox"></i> No completed orders yet. Add from Admin Panel.</div>';
                return;
            }
            
            let html = '';
            displayOrders.forEach((order) => {
                const date = new Date(order.timestamp);
                const formattedDate = date.toLocaleString('en-US', { 
                    day: '2-digit', month: 'short', year: 'numeric', 
                    hour: '2-digit', minute: '2-digit' 
                });
                const orderNumber = order.orderId !== 'N/A' ? order.orderId : order.id?.slice(-6) || 'ORD';
                
                // Twitter link handling: ONLY show the raw link from admin panel without any @username text
                // If twitterId field exists and is a valid URL, display clickable link with just the URL text.
                // If not a URL or empty, show 'N/A' and no extra formatting.
                let twitterDisplay = 'N/A';
                let twitterLinkRaw = order.twitterId ? order.twitterId.trim() : '';
                if (twitterLinkRaw !== '' && twitterLinkRaw !== 'N/A') {
                    // Display the exact link as text, but make it clickable
                    twitterDisplay = `<a href="${twitterLinkRaw}" target="_blank" class="twitter-link" rel="noopener noreferrer">${twitterLinkRaw}</a>`;
                } else {
                    twitterDisplay = 'N/A';
                }
                
                // "COMPLETE" badge next to Order ID
                html += `
                    <div class="order-item">
                        <div class="order-header">
                            <span class="order-id">
                                <i class="fas fa-hashtag"></i> Order ${orderNumber}
                                <span class="complete-badge"><i class="fas fa-check-circle"></i> COMPLETE</span>
                            </span>
                            <span class="order-product"><i class="fas fa-tag"></i> ${escapeHtml(order.productName)} — ${escapeHtml(order.premiumType)}</span>
                            <span class="order-date"><i class="far fa-calendar-alt"></i> ${formattedDate}</span>
                        </div>
                        <div class="order-details">
                            <span><i class="fab fa-twitter"></i> Twitter: ${twitterDisplay}</span>
                            <span><i class="fas fa-calendar-week"></i> ${order.months} month(s)</span>
                            <span><i class="fas fa-dollar-sign"></i> $${order.amount}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }).catch(err => {
            console.error("Order load error:", err);
            document.getElementById('orderHistoryList').innerHTML = '<div class="empty-msg"><i class="fas fa-exclamation-triangle"></i> Error loading orders</div>';
        });
    }
    
    // Simple escape for XSS safety
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Real-time listeners: whenever orders change, refresh history and stats
    function refreshOrdersAndStats() {
        loadOrderHistory(); // this will also update today stats
    }
    
    db.ref('orders').on('child_added', () => { refreshOrdersAndStats(); });
    db.ref('orders').on('child_removed', () => { refreshOrdersAndStats(); });
    db.ref('orders').on('child_changed', () => { refreshOrdersAndStats(); });
    
    // Auto refresh every 8 seconds for realtime sync (fallback)
    setInterval(() => { refreshOrdersAndStats(); }, 8000);
    
    // Initialize all modules
    loadBanners();
    loadProducts();
    loadContactButtons();
    loadOrderHistory();      // initial load + stats calculation
</script>
</body>
</html>
