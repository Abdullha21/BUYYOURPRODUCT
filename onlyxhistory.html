<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>X Premium Order Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:#000;color:#fff;}
        
        .header{background:#000;padding:12px 16px;border-bottom:2px solid #1DA1F2;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
        .logo{color:#1DA1F2;font-size:18px;font-weight:bold;display:flex;align-items:center;gap:8px;}
        .twitter-badge{background:#1DA1F2;color:#000;padding:4px 12px;border-radius:20px;font-size:11px;}
        .container{max-width:600px;margin:0 auto;padding:12px;}
        
        /* Today Order Card */
        .today-card{background:linear-gradient(135deg,#1a2a3a,#0f1a2a);border-radius:20px;padding:16px;margin-bottom:20px;text-align:center;border:1px solid #1DA1F2;}
        .today-card .label{font-size:12px;color:#aaa;}
        .today-card .count{font-size:42px;font-weight:bold;color:#00ff9d;}
        .today-card .sub{font-size:10px;color:#666;margin-top:5px;}
        
        /* Package Cards */
        .package-selector{display:flex;gap:12px;margin-bottom:20px;}
        .package-card{flex:1;background:#111;border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;border:1.5px solid #222;}
        .package-card.selected{border-color:#1DA1F2;background:#1a2a3a;}
        .package-card h3{font-size:14px;margin-bottom:5px;}
        .package-card .price-range{font-size:12px;color:#00ff9d;}
        
        /* Plan Cards */
        .plan-selector{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
        .plan-card{flex:0 0 auto;min-width:85px;background:#111;border-radius:14px;padding:10px;text-align:center;cursor:pointer;border:1.5px solid #222;}
        .plan-card.selected{border-color:#00ff9d;background:#1a2a1a;}
        .plan-card .duration{font-size:13px;font-weight:600;}
        .plan-card .price{font-size:14px;color:#00ff9d;margin-top:5px;}
        
        .selected-info{background:#1a2a3a;border-radius:12px;padding:10px;margin-bottom:15px;text-align:center;font-size:13px;border:1px solid #1DA1F2;}
        .selected-info span{color:#00ff9d;font-weight:bold;}
        
        .form-group{margin-bottom:15px;}
        .form-group label{font-size:12px;color:#aaa;margin-bottom:5px;display:block;}
        .form-group input{width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:12px;color:#fff;font-size:14px;}
        .quick-customer{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
        .quick-customer-btn{background:#1a1a1a;border:none;padding:5px 12px;border-radius:20px;color:#aaa;font-size:11px;cursor:pointer;}
        
        .submit-btn{background:#00ff9d;color:#000;border:none;padding:14px;border-radius:40px;font-weight:bold;width:100%;font-size:15px;cursor:pointer;margin-top:5px;}
        .info-note{font-size:10px;color:#555;text-align:center;margin-top:8px;}
        
        /* Orders Section */
        .orders-section{margin-top:20px;background:#0a0a0a;border-radius:20px;padding:16px;border:1px solid #222;}
        .orders-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
        .total-badge{background:#1a1a1a;padding:5px 12px;border-radius:30px;font-size:12px;}
        .total-badge span{color:#00ff9d;font-weight:bold;}
        .refresh-btn{background:#1DA1F2;color:#000;border:none;padding:5px 12px;border-radius:30px;font-size:11px;cursor:pointer;}
        .filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
        .filter-btn{background:#1a1a1a;border:none;padding:4px 12px;border-radius:30px;color:#aaa;font-size:11px;cursor:pointer;}
        .filter-btn.active{background:#1DA1F2;color:#000;}
        
        .orders-list{max-height:400px;overflow-y:auto;}
        .order-item{background:#111;border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid #1DA1F2;}
        .order-header{display:flex;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:5px;}
        .order-product{font-weight:bold;font-size:13px;}
        .order-status{font-size:9px;padding:2px 8px;border-radius:20px;}
        .status-Completed{background:#00ff9d33;color:#00ff9d;}
        .order-details{font-size:11px;color:#aaa;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
        .delete-btn{background:#ff4444;color:#fff;border:none;padding:4px 10px;border-radius:20px;font-size:10px;cursor:pointer;}
        
        .footer{text-align:center;padding:15px;font-size:10px;color:#444;border-top:1px solid #222;margin-top:20px;}
        .toast{position:fixed;bottom:80px;left:20px;right:20px;background:#1f1f1f;border-left:4px solid #00ff9d;padding:10px;border-radius:12px;text-align:center;display:none;z-index:300;font-size:12px;}
        .empty-state{text-align:center;padding:30px;color:#666;font-size:12px;}
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><i class="fab fa-twitter"></i> X Order Manager</div>
    <div class="twitter-badge">Fast Order</div>
</div>

<div class="container">
    
    <!-- Today Order Count -->
    <div class="today-card">
        <div class="label"><i class="fas fa-calendar-day"></i> TODAY'S ORDERS</div>
        <div class="count" id="todayCount">0</div>
        <div class="sub">orders added today</div>
    </div>
    
    <!-- Package Selection -->
    <div class="package-selector">
        <div class="package-card" data-package="normal" onclick="selectPackage('normal')">
            <h3>X PREMIUM NORMAL</h3>
            <div class="price-range">$6 - $9</div>
        </div>
        <div class="package-card" data-package="plus" onclick="selectPackage('plus')">
            <h3>X PREMIUM PLUS</h3>
            <div class="price-range">$12 - $20</div>
        </div>
    </div>
    
    <!-- Plan Selection -->
    <div class="plan-selector" id="planSelector">
        <div style="width:100%;text-align:center;color:#666;font-size:12px;padding:15px;">Select package first</div>
    </div>
    
    <!-- Selected Info -->
    <div class="selected-info" id="selectedInfo">
        📦 <span id="selectedDisplay">None</span>
    </div>
    
    <!-- Customer Input -->
    <div class="form-group">
        <label><i class="fab fa-twitter"></i> Twitter/X Username *</label>
        <input type="text" id="customerName" placeholder="@username" autocomplete="off">
        <div class="quick-customer">
            <span class="quick-customer-btn" onclick="setCustomer('@user1')">@user1</span>
            <span class="quick-customer-btn" onclick="setCustomer('@user2')">@user2</span>
            <span class="quick-customer-btn" onclick="setCustomer('@client')">@client</span>
        </div>
    </div>
    
    <button class="submit-btn" onclick="quickAddOrder()">
        <i class="fab fa-twitter"></i> Add X Order
    </button>
    <div class="info-note">✅ Orders auto-marked as Completed</div>
    
    <!-- Orders List -->
    <div class="orders-section">
        <div class="orders-header">
            <div class="total-badge">
                <i class="fab fa-twitter"></i> Total: <span id="totalOrders">0</span>
            </div>
            <button class="refresh-btn" onclick="loadAllData()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="filterOrders('all')">All</button>
            <button class="filter-btn" data-filter="Completed" onclick="filterOrders('Completed')">Completed</button>
        </div>
        
        <div class="orders-list" id="ordersList">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        </div>
    </div>
</div>

<div class="footer">Developed by MD Abdullah Khan | X Order System</div>
<div id="toastMsg" class="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAmg5AagXdej2DgvdQ-q5Dqddbgc3Fu2oA",authDomain:"premium-store-v1.firebaseapp.com",projectId:"premium-store-v1",storageBucket:"premium-store-v1.firebasestorage.app",messagingSenderId:"838970946697",appId:"1:838970946697:web:fcaecf864d91c16967c258"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const plans={
    normal:[
        {duration:"3 Months",months:3,price:6},
        {duration:"6 Months",months:6,price:9}
    ],
    plus:[
        {duration:"3 Months",months:3,price:12},
        {duration:"6 Months",months:6,price:16},
        {duration:"12 Months",months:12,price:20}
    ]
};

let selectedPackage=null;
let selectedPlan=null;
let allOrders=[];      // সব অর্ডার (টোটাল কাউন্টের জন্য)
let latest20Orders=[]; // শুধু লেটেস্ট ২০টা
let totalOrderCount=0;
let currentFilter='all';

function showToast(msg,isError=false){
    let t=document.getElementById('toastMsg');
    t.innerText=msg;
    t.style.borderLeftColor=isError?'#ff4444':'#00ff9d';
    t.style.display='block';
    setTimeout(()=>t.style.display='none',2000);
}

function getTodayStart(){
    let today=new Date();
    today.setHours(0,0,0,0);
    return today;
}

// লোড অল ডাটা (টোটাল কাউন্ট + লেটেস্ট ২০)
async function loadAllData(){
    try{
        // সব অর্ডার নিচ্ছি টোটাল কাউন্টের জন্য
        let allSnap=await db.collection('orders').orderBy('timestamp','desc').get();
        totalOrderCount=allSnap.size;
        document.getElementById('totalOrders').innerText=totalOrderCount;
        
        // শুধু লেটেস্ট ২০টা অর্ডার নিচ্ছি
        let snap=await db.collection('orders').orderBy('timestamp','desc').limit(20).get();
        latest20Orders=[];
        snap.forEach(doc=>{
            let o=doc.data();
            o.id=doc.id;
            if(o.timestamp) o.timestampDate=o.timestamp.toDate();
            latest20Orders.push(o);
        });
        
        // টুডে অর্ডার কাউন্ট
        let todayStart=getTodayStart();
        let todayCount=0;
        allSnap.forEach(doc=>{
            let o=doc.data();
            if(o.timestamp){
                let date=o.timestamp.toDate();
                if(date>=todayStart) todayCount++;
            }
        });
        document.getElementById('todayCount').innerText=todayCount;
        
        displayOrders();
        
    }catch(e){
        console.error("Error:",e);
        document.getElementById('ordersList').innerHTML='<div class="empty-state">Error loading orders</div>';
    }
}

function displayOrders(){
    let ordersList=document.getElementById('ordersList');
    let filtered=currentFilter==='all'?latest20Orders:latest20Orders.filter(o=>o.status===currentFilter);
    
    if(filtered.length===0){
        ordersList.innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><br>No orders found</div>';
        return;
    }
    
    ordersList.innerHTML='';
    // Order ID: টোটাল অর্ডার থেকে শুরু (সবচেয়ে নতুন = টোটাল নম্বর)
    filtered.forEach((order,idx)=>{
        let orderId=totalOrderCount-idx;
        let date=order.timestampDate?order.timestampDate.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Just now';
        let price=order.price?`$${order.price}`:'';
        
        let div=document.createElement('div');
        div.className='order-item';
        div.innerHTML=`
            <div class="order-header">
                <span class="order-product">#${orderId} | ${escapeHtml(order.productName||'X Service')}</span>
                <span class="order-status status-Completed">Completed</span>
            </div>
            <div class="order-details">
                <span>📅 ${date}</span>
                <span>⏱ ${escapeHtml(order.months||'Standard')}</span>
                ${price?`<span>💰 ${price}</span>`:''}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span><i class="fab fa-twitter"></i> ${escapeHtml(order.customer||'Guest')}</span>
                <button class="delete-btn" onclick="deleteOrder('${order.id}')"><i class="fas fa-trash"></i> Del</button>
            </div>
        `;
        ordersList.appendChild(div);
    });
}

function filterOrders(filter){
    currentFilter=filter;
    document.querySelectorAll('.filter-btn').forEach(btn=>{
        if(btn.dataset.filter===filter) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    displayOrders();
}

async function deleteOrder(orderId){
    if(confirm("Delete this order?")){
        try{
            await db.collection('orders').doc(orderId).delete();
            showToast("Order deleted!");
            loadAllData();
        }catch(e){
            showToast("Error: "+e.message,true);
        }
    }
}

// Package & Plan Functions
function selectPackage(pkg){
    selectedPackage=pkg;
    selectedPlan=null;
    document.querySelectorAll('.package-card').forEach(card=>{
        if(card.dataset.package===pkg) card.classList.add('selected');
        else card.classList.remove('selected');
    });
    
    let planSelector=document.getElementById('planSelector');
    planSelector.innerHTML='';
    plans[pkg].forEach((plan,index)=>{
        let div=document.createElement('div');
        div.className='plan-card';
        if(index===0){
            div.classList.add('selected');
            selectedPlan=plan;
        }
        div.innerHTML=`<div class="duration">${plan.duration}</div><div class="price">$${plan.price}</div>`;
        div.onclick=()=>selectPlan(plan);
        planSelector.appendChild(div);
    });
    updateSelectedInfo();
}

function selectPlan(plan){
    selectedPlan=plan;
    document.querySelectorAll('.plan-card').forEach(card=>{
        let priceSpan=card.querySelector('.price');
        if(priceSpan && priceSpan.innerText===`$${plan.price}`){
            card.classList.add('selected');
        }else{
            card.classList.remove('selected');
        }
    });
    updateSelectedInfo();
}

function updateSelectedInfo(){
    let span=document.getElementById('selectedDisplay');
    if(selectedPackage && selectedPlan){
        let name=selectedPackage==='normal'?'X PREMIUM NORMAL':'X PREMIUM PLUS';
        span.innerHTML=`${name}<br>${selectedPlan.duration} - $${selectedPlan.price}`;
    }else if(selectedPackage){
        span.innerHTML=selectedPackage==='normal'?'X PREMIUM NORMAL (select plan)':'X PREMIUM PLUS (select plan)';
    }else{
        span.innerHTML='None';
    }
}

function setCustomer(name){
    document.getElementById('customerName').value=name;
}

async function quickAddOrder(){
    if(!selectedPackage){showToast("Select X PREMIUM NORMAL or PLUS first",true);return;}
    if(!selectedPlan){showToast("Select duration",true);return;}
    let customer=document.getElementById('customerName').value.trim();
    if(!customer){showToast("Enter Twitter/X username",true);return;}
    
    let packageName=selectedPackage==='normal'?'X PREMIUM NORMAL':'X PREMIUM PLUS';
    try{
        await db.collection('orders').add({
            productName:packageName,
            months:selectedPlan.duration,
            price:selectedPlan.price,
            customer:customer,
            status:'Completed',
            timestamp:firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast(`✅ Added! ${packageName} - ${selectedPlan.duration} - $${selectedPlan.price}`);
        document.getElementById('customerName').value='';
        loadAllData();
    }catch(e){
        showToast("Error: "+e.message,true);
    }
}

function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/[&<>]/g,function(m){
        if(m==='&') return '&amp;';
        if(m==='<') return '&lt;';
        if(m==='>') return '&gt;';
        return m;
    });
}

// Auto refresh every 15 seconds
setInterval(()=>{loadAllData();},15000);

window.onload=()=>{
    loadAllData();
    selectPackage('normal');
};
</script>
</body>
</html>
