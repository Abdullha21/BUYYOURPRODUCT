<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Order History & Reviews - Premium Stores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;}
        
        .header{background:#000;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid #00bfff;}
        .logo{color:#00bfff;font-size:20px;font-weight:bold;display:flex;align-items:center;gap:8px;text-decoration:none;}
        .back-btn{background:#1f1f1f;padding:8px 18px;border-radius:40px;color:#fff;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:8px;}
        .back-btn:hover{background:#00bfff;color:#000;}
        
        .container{max-width:1200px;margin:0 auto;padding:15px;}
        .two-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        @media(max-width:700px){.two-columns{grid-template-columns:1fr;}}
        
        .orders-section,.reviews-section{background:#0f0f0f;border-radius:20px;padding:18px;border:1px solid #222;}
        .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
        .section-header h2{color:#00bfff;font-size:18px;}
        .badge{background:#00bfff;color:#000;padding:4px 12px;border-radius:30px;font-size:12px;}
        .refresh-btn{background:#00bfff;color:#000;border:none;padding:6px 14px;border-radius:30px;cursor:pointer;font-size:12px;}
        .filter-bar{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;}
        .filter-btn{background:#1f1f1f;border:none;padding:5px 14px;border-radius:30px;color:#aaa;cursor:pointer;font-size:12px;}
        .filter-btn.active{background:#00bfff;color:#000;}
        
        .orders-list{max-height:450px;overflow-y:auto;}
        .order-card{background:#111;border-radius:12px;padding:12px;margin-bottom:10px;border-left:3px solid #00bfff;}
        .order-header{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:5px;}
        .order-status{padding:3px 10px;border-radius:20px;font-size:10px;}
        .status-Completed{background:#00ff9d33;color:#00ff9d;}
        .status-Pending{background:#ffaa0033;color:#ffaa00;}
        .order-details{font-size:12px;color:#aaa;display:flex;gap:12px;flex-wrap:wrap;}
        
        .review-form{background:#111;border-radius:16px;padding:15px;margin-bottom:18px;}
        .review-form h3{color:#00ff9d;font-size:15px;margin-bottom:12px;}
        .review-form input,.review-form textarea{width:100%;padding:12px;background:#1e1e1e;border:1px solid #333;border-radius:12px;color:#fff;margin-bottom:12px;font-size:13px;}
        .review-form textarea{min-height:80px;resize:vertical;}
        .rating-stars{margin-bottom:12px;}
        .star-select{font-size:22px;cursor:pointer;margin-right:5px;color:#555;}
        .star-select.selected{color:#ffaa00;}
        .submit-review{background:#00ff9d;color:#000;border:none;padding:12px;border-radius:40px;font-weight:bold;width:100%;cursor:pointer;}
        
        .reviews-list{max-height:400px;overflow-y:auto;}
        .review-card{background:#111;border-radius:12px;padding:12px;margin-bottom:10px;border-bottom:1px solid #222;}
        .review-header{display:flex;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;}
        .reviewer-name{font-weight:bold;color:#00bfff;font-size:13px;}
        .review-date{font-size:10px;color:#666;}
        .review-text{font-size:12px;color:#bbb;margin-top:5px;line-height:1.4;}
        .review-rating{color:#ffaa00;font-size:12px;margin-top:3px;}
        
        .empty-state{text-align:center;padding:30px;color:#666;}
        .loading{text-align:center;padding:30px;}
        .footer-credit{text-align:center;padding:15px;font-size:11px;color:#555;border-top:1px solid #222;margin-top:20px;}
        .toast{position:fixed;bottom:100px;left:20px;right:20px;background:#1f1f1f;border-left:4px solid #00ff9d;padding:12px;border-radius:12px;text-align:center;display:none;z-index:300;font-size:13px;}
    </style>
</head>
<body>

<div class="header">
    <a href="#" class="logo"><i class="fas fa-crown"></i> Premium Stores</a>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Shop</a>
</div>

<div class="container">
    <div class="two-columns">
        
        <!-- LEFT: Orders History (Latest 20 orders, কিন্তু ID সঠিক দেখাবে) -->
        <div class="orders-section">
            <div class="section-header">
                <h2><i class="fas fa-history"></i> Order History</h2>
                <div class="badge">Latest 20 Orders</div>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all" onclick="filterOrders('all')">All</button>
                <button class="filter-btn" data-filter="Completed" onclick="filterOrders('Completed')">Completed</button>
                <button class="filter-btn" data-filter="Pending" onclick="filterOrders('Pending')">Pending</button>
                <button class="refresh-btn" onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div class="orders-list" id="ordersList">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>
            </div>
        </div>
        
        <!-- RIGHT: Customer Reviews -->
        <div class="reviews-section">
            <div class="section-header">
                <h2><i class="fas fa-star"></i> Customer Reviews</h2>
                <div class="badge" id="reviewCount">0 Reviews</div>
            </div>
            
            <div class="review-form">
                <h3><i class="fas fa-pen"></i> Share Your Experience</h3>
                <input type="text" id="reviewerName" placeholder="Your Name *">
                <div class="rating-stars" id="ratingStars">
                    <i class="far fa-star star-select" data-rating="1" onclick="setRating(1)"></i>
                    <i class="far fa-star star-select" data-rating="2" onclick="setRating(2)"></i>
                    <i class="far fa-star star-select" data-rating="3" onclick="setRating(3)"></i>
                    <i class="far fa-star star-select" data-rating="4" onclick="setRating(4)"></i>
                    <i class="far fa-star star-select" data-rating="5" onclick="setRating(5)"></i>
                    <span style="margin-left:8px;font-size:12px;color:#aaa;">Select Rating</span>
                </div>
                <textarea id="reviewText" placeholder="Write your review about our service..."></textarea>
                <button class="submit-review" onclick="submitReview()"><i class="fas fa-paper-plane"></i> Submit Review</button>
            </div>
            
            <div class="reviews-list" id="reviewsList">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading reviews...</div>
            </div>
        </div>
    </div>
</div>

<div class="footer-credit">Developed by MD Abdullah Khan</div>
<div id="toastMsg" class="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAmg5AagXdej2DgvdQ-q5Dqddbgc3Fu2oA",authDomain:"premium-store-v1.firebaseapp.com",projectId:"premium-store-v1",storageBucket:"premium-store-v1.firebasestorage.app",messagingSenderId:"838970946697",appId:"1:838970946697:web:fcaecf864d91c16967c258"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let allOrders=[];      // সব অর্ডার (Total)
let latest20Orders=[]; // শুধু লেটেস্ট ২০টা
let totalOrderCount=0;
let allReviews=[];
let currentFilter='all';
let selectedRating=0;

function showToast(msg,isError=false){
    let t=document.getElementById('toastMsg');
    t.innerText=msg;
    t.style.borderLeftColor=isError?'#ff4444':'#00ff9d';
    t.style.display='block';
    setTimeout(()=>t.style.display='none',2500);
}

// ========== ORDERS (Total count ঠিক, ID ক্রম ঠিক, শুধু ২০টা দেখাবে) ==========
async function loadOrders(){
    let ordersList=document.getElementById('ordersList');
    ordersList.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>';
    try{
        // প্রথমে টোটাল কাউন্ট পাওয়ার জন্য সব অর্ডার নিচ্ছি
        let allSnap=await db.collection('orders').orderBy('timestamp','desc').get();
        totalOrderCount=allSnap.size;
        
        // লেটেস্ট ২০টা অর্ডার নিচ্ছি
        let snap=await db.collection('orders').orderBy('timestamp','desc').limit(20).get();
        latest20Orders=[];
        let globalIndex=0;
        
        allSnap.forEach(doc=>{
            globalIndex++;
        });
        
        snap.forEach(doc=>{
            let o=doc.data();
            o.id=doc.id;
            if(o.timestamp) o.timestampDate=o.timestamp.toDate();
            latest20Orders.push(o);
        });
        
        displayOrders();
    }catch(e){
        ordersList.innerHTML='<div class="empty-state">Error loading orders</div>';
        console.error(e);
    }
}

function displayOrders(){
    let ordersList=document.getElementById('ordersList');
    let filtered=currentFilter==='all'?latest20Orders:latest20Orders.filter(o=>(o.status||'Completed')===currentFilter);
    
    if(filtered.length===0){
        ordersList.innerHTML='<div class="empty-state">No orders found</div>';
        return;
    }
    
    ordersList.innerHTML='';
    // ID দেখানো: Total Order - currentPosition
    // যাতে #1 সবচেয়ে নতুন, #totalOrder সবচেয়ে পুরাতন
    filtered.forEach((order,displayIndex)=>{
        // এই অর্ডারটি সব অর্ডারের মধ্যে কততম (লেটেস্ট ২০ এর মধ্যে)
        // আসল Order ID = TotalOrderCount - (লেটেস্ট লিস্টে এই অর্ডারের পজিশন)
        let actualOrderId = totalOrderCount - displayIndex;
        
        let date=order.timestampDate?order.timestampDate.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Just now';
        let status=order.status||'Completed';
        let price=order.price?`$${order.price}`:'';
        
        let div=document.createElement('div');
        div.className='order-card';
        div.innerHTML=`
            <div class="order-header">
                <span><strong style="color:#00bfff;">#${actualOrderId}</strong> | ${escapeHtml(order.productName||'Product')}</span>
                <span class="order-status status-${status}">${status}</span>
            </div>
            <div class="order-details">
                <span>📅 ${date}</span>
                <span>⏱ ${escapeHtml(order.months||'Standard')}</span>
                ${price?`<span>💰 ${price}</span>`:''}
                <span>👤 ${escapeHtml(order.customer||'Guest')}</span>
            </div>
        `;
        ordersList.appendChild(div);
    });
    
    // টোটাল অর্ডার কাউন্ট আপডেট
    document.querySelector('.orders-section .badge').innerHTML=`Latest 20 of ${totalOrderCount} Orders`;
}

function filterOrders(filter){
    currentFilter=filter;
    document.querySelectorAll('.filter-btn').forEach(btn=>{
        if(btn.dataset.filter===filter) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    displayOrders();
}

// ========== REVIEW SYSTEM ==========
function setRating(rating){
    selectedRating=rating;
    let stars=document.querySelectorAll('.star-select');
    stars.forEach((star,i)=>{
        if(i<rating){
            star.className='fas fa-star star-select selected';
            star.style.color='#ffaa00';
        }else{
            star.className='far fa-star star-select';
            star.style.color='#555';
        }
    });
}

async function submitReview(){
    let name=document.getElementById('reviewerName').value.trim();
    let review=document.getElementById('reviewText').value.trim();
    
    if(!name){
        showToast("Please enter your name",true);
        return;
    }
    if(!review){
        showToast("Please write your review",true);
        return;
    }
    if(selectedRating===0){
        showToast("Please select a rating",true);
        return;
    }
    
    try{
        await db.collection('reviews').add({
            name:name,
            review:review,
            rating:selectedRating,
            timestamp:firebase.firestore.FieldValue.serverTimestamp()
        });
        
        document.getElementById('reviewerName').value='';
        document.getElementById('reviewText').value='';
        setRating(0);
        selectedRating=0;
        
        showToast("✅ Thank you for your review!");
        loadReviews();
        
    }catch(e){
        console.error("Error:",e);
        showToast("Error: "+e.message,true);
    }
}

async function loadReviews(){
    let reviewsList=document.getElementById('reviewsList');
    reviewsList.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading reviews...</div>';
    try{
        let snap=await db.collection('reviews').orderBy('timestamp','desc').limit(30).get();
        allReviews=[];
        snap.forEach(doc=>{
            let r=doc.data();
            r.id=doc.id;
            if(r.timestamp) r.timestampDate=r.timestamp.toDate();
            allReviews.push(r);
        });
        
        document.getElementById('reviewCount').innerText=allReviews.length+' Reviews';
        
        if(allReviews.length===0){
            reviewsList.innerHTML='<div class="empty-state"><i class="fas fa-comment-dots"></i><br>No reviews yet. Be the first!</div>';
            return;
        }
        
        reviewsList.innerHTML='';
        allReviews.forEach(rev=>{
            let date=rev.timestampDate?rev.timestampDate.toLocaleDateString():'Recently';
            let stars='';
            for(let i=1;i<=5;i++){
                stars+=i<=rev.rating?'★':'☆';
            }
            let div=document.createElement('div');
            div.className='review-card';
            div.innerHTML=`
                <div class="review-header">
                    <span class="reviewer-name"><i class="fas fa-user-circle"></i> ${escapeHtml(rev.name)}</span>
                    <span class="review-date">${date}</span>
                </div>
                <div class="review-rating">${stars}</div>
                <div class="review-text">"${escapeHtml(rev.review)}"</div>
            `;
            reviewsList.appendChild(div);
        });
    }catch(e){
        console.error("Error loading reviews:",e);
        reviewsList.innerHTML='<div class="empty-state">Error loading reviews</div>';
    }
}

function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/[&<>]/g,function(m){
        if(m==='&') return '&amp;';
        if(m==='<') return '&lt;';
        if(m==='>') return '&gt;';
        return m;
    });
}

// Auto refresh every 20 seconds
setInterval(()=>{loadOrders();loadReviews();},20000);

window.onload=()=>{
    loadOrders();
    loadReviews();
};
</script>
</body>
</html>
