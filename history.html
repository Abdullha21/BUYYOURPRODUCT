<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Order History & Reviews - Premium Stores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            min-height: 100vh;
        }
        
        .header {
            background: #000; 
            padding: 15px 20px; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 2px solid #00bfff;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 22px; 
            font-weight: bold; 
            color: #00bfff; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            text-decoration: none;
        }
        .logo i { font-size: 26px; color: #00ff9d; }
        
        .back-btn {
            background: #1f1f1f;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #00bfff;
            color: black;
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Two column layout */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        @media (max-width: 900px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
        
        /* Orders Section */
        .orders-section, .reviews-section {
            background: #0f0f0f;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #222;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
        }
        
        .section-header h2 {
            color: #00bfff;
            font-size: 22px;
        }
        
        .badge {
            background: #00bfff;
            color: black;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .refresh-btn {
            background: #00bfff;
            color: black;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: #1f1f1f;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        
        .filter-btn.active {
            background: #00bfff;
            color: black;
        }
        
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .orders-list::-webkit-scrollbar {
            width: 5px;
        }
        
        .orders-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        
        .orders-list::-webkit-scrollbar-thumb {
            background: #00bfff;
            border-radius: 10px;
        }
        
        .order-card {
            background: #111;
            border-radius: 12px;
            padding: 12px;
            transition: 0.2s;
            border-left: 3px solid #00bfff;
        }
        
        .order-card:hover {
            background: #161616;
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .order-id {
            font-weight: bold;
            color: #00bfff;
            font-size: 12px;
        }
        
        .order-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }
        
        .status-Pending { background: #ffaa0033; color: #ffaa00; border: 1px solid #ffaa00; }
        .status-Completed { background: #00ff9d33; color: #00ff9d; border: 1px solid #00ff9d; }
        .status-Cancelled { background: #ff444433; color: #ff8888; border: 1px solid #ff4444; }
        
        .order-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: #bbb;
        }
        
        .order-details i {
            width: 14px;
            color: #00bfff;
        }
        
        /* Reviews Section */
        .review-form {
            background: #111;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }
        
        .review-form h3 {
            margin-bottom: 15px;
            color: #00ff9d;
            font-size: 16px;
        }
        
        .review-form input, .review-form textarea {
            width: 100%;
            padding: 12px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .review-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .submit-review {
            background: #00ff9d;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        
        .reviews-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .reviews-list::-webkit-scrollbar {
            width: 5px;
        }
        
        .reviews-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        
        .reviews-list::-webkit-scrollbar-thumb {
            background: #00bfff;
            border-radius: 10px;
        }
        
        .review-card {
            background: #111;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-bottom: 1px solid #222;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .reviewer-name {
            font-weight: bold;
            color: #00bfff;
        }
        
        .review-date {
            font-size: 10px;
            color: #666;
        }
        
        .review-rating {
            color: #ffaa00;
            margin-bottom: 8px;
        }
        
        .review-text {
            font-size: 13px;
            color: #bbb;
            line-height: 1.5;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .footer-credit {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #555;
            border-top: 1px solid #222;
            margin-top: 30px;
        }
        
        .star {
            color: #ffaa00;
            margin-right: 2px;
        }
        
        .info-text {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="#" class="logo">
            <i class="fas fa-crown"></i>
            Premium Stores
        </a>
        <a href="premiumfuture.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Shop
        </a>
    </div>

    <div class="container">
        <div class="two-columns">
            
            <!-- LEFT COLUMN: Orders History (Latest 20) -->
            <div class="orders-section">
                <div class="section-header">
                    <h2><i class="fas fa-history"></i> Latest Orders</h2>
                    <div class="badge">Last 20 Orders</div>
                </div>
                
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all" onclick="filterOrders('all')">All</button>
                    <button class="filter-btn" data-filter="Pending" onclick="filterOrders('Pending')">Pending</button>
                    <button class="filter-btn" data-filter="Completed" onclick="filterOrders('Completed')">Completed</button>
                    <button class="filter-btn" data-filter="Cancelled" onclick="filterOrders('Cancelled')">Cancelled</button>
                    <button class="refresh-btn" onclick="loadAllOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                
                <div class="orders-list" id="ordersList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading orders...</p></div>
                </div>
                <div class="info-text">
                    <i class="fas fa-info-circle"></i> Showing latest 20 orders from database
                </div>
            </div>
            
            <!-- RIGHT COLUMN: User Reviews -->
            <div class="reviews-section">
                <div class="section-header">
                    <h2><i class="fas fa-star"></i> Customer Reviews</h2>
                    <div class="badge" id="reviewCount">0 Reviews</div>
                </div>
                
                <!-- Review Form -->
                <div class="review-form">
                    <h3><i class="fas fa-pen"></i> Share Your Experience</h3>
                    <input type="text" id="reviewerName" placeholder="Your Name *">
                    <div class="review-rating" id="ratingStars">
                        <i class="far fa-star star-select" data-rating="1" onclick="setRating(1)"></i>
                        <i class="far fa-star star-select" data-rating="2" onclick="setRating(2)"></i>
                        <i class="far fa-star star-select" data-rating="3" onclick="setRating(3)"></i>
                        <i class="far fa-star star-select" data-rating="4" onclick="setRating(4)"></i>
                        <i class="far fa-star star-select" data-rating="5" onclick="setRating(5)"></i>
                        <span style="margin-left: 10px; font-size: 12px; color:#aaa;">Select Rating</span>
                    </div>
                    <textarea id="reviewText" placeholder="Write your review about our website and products..."></textarea>
                    <button class="submit-review" onclick="submitReview()"><i class="fas fa-paper-plane"></i> Submit Review</button>
                </div>
                
                <!-- Reviews List (Latest 30) -->
                <div class="reviews-list" id="reviewsList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading reviews...</p></div>
                </div>
                <div class="info-text">
                    <i class="fas fa-scroll"></i> Latest 30 reviews - Scroll for more
                </div>
            </div>
        </div>
    </div>

    <div class="footer-credit">
        Developed by MD Abdullah Khan
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAmg5AagXdej2DgvdQ-q5Dqddbgc3Fu2oA",
            authDomain: "premium-store-v1.firebaseapp.com",
            projectId: "premium-store-v1",
            storageBucket: "premium-store-v1.firebasestorage.app",
            messagingSenderId: "838970946697",
            appId: "1:838970946697:web:fcaecf864d91c16967c258"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allOrders = [];
        let allReviews = [];
        let currentFilter = 'all';
        let selectedRating = 0;

        // ======================= ORDERS (Latest 20 only) =======================
        async function loadAllOrders() {
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading orders...</p></div>';
            
            try {
                // Get only latest 20 orders
                const snapshot = await db.collection('orders')
                    .orderBy('timestamp', 'desc')
                    .limit(20)
                    .get();
                
                allOrders = [];
                snapshot.forEach(doc => {
                    allOrders.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                displayOrders();
                
            } catch (error) {
                console.error("Error:", error);
                ordersList.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading orders</p>
                    </div>
                `;
            }
        }
        
        function displayOrders() {
            const ordersList = document.getElementById('ordersList');
            let filteredOrders = allOrders;
            
            if (currentFilter !== 'all') {
                filteredOrders = allOrders.filter(order => order.status === currentFilter);
            }
            
            if (filteredOrders.length === 0) {
                ordersList.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <p>No orders found</p>
                    </div>
                `;
                return;
            }
            
            ordersList.innerHTML = '';
            
            filteredOrders.forEach((order, index) => {
                const date = order.timestamp ? order.timestamp.toDate().toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Recent';
                
                const orderCard = document.createElement('div');
                orderCard.className = 'order-card';
                orderCard.innerHTML = `
                    <div class="order-header">
                        <span class="order-id"><i class="fas fa-hashtag"></i> #${allOrders.length - index}</span>
                        <span class="order-status status-${order.status || 'Pending'}">${order.status || 'Pending'}</span>
                    </div>
                    <div class="order-details">
                        <span><i class="fas fa-box"></i> ${escapeHtml(order.productName || 'N/A')}</span>
                        <span><i class="fas fa-calendar-week"></i> ${escapeHtml(order.months || 'Standard')}</span>
                        <span><i class="fas fa-user"></i> ${escapeHtml(order.customer || 'Guest')}</span>
                        <span><i class="fas fa-clock"></i> ${escapeHtml(date)}</span>
                    </div>
                `;
                ordersList.appendChild(orderCard);
            });
        }
        
        function filterOrders(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            displayOrders();
        }

        // ======================= REVIEWS SYSTEM =======================
        function setRating(rating) {
            selectedRating = rating;
            const stars = document.querySelectorAll('.star-select');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.className = 'fas fa-star star-select';
                    star.style.color = '#ffaa00';
                } else {
                    star.className = 'far fa-star star-select';
                    star.style.color = '#555';
                }
            });
        }
        
        async function submitReview() {
            const name = document.getElementById('reviewerName').value.trim();
            const review = document.getElementById('reviewText').value.trim();
            
            if (!name) {
                alert("Please enter your name");
                return;
            }
            if (!review) {
                alert("Please write your review");
                return;
            }
            if (selectedRating === 0) {
                alert("Please select a rating");
                return;
            }
            
            try {
                await db.collection('reviews').add({
                    name: name,
                    review: review,
                    rating: selectedRating,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Clear form
                document.getElementById('reviewerName').value = '';
                document.getElementById('reviewText').value = '';
                selectedRating = 0;
                setRating(0);
                
                alert("Thank you for your review!");
                loadReviews();
                
            } catch (error) {
                console.error("Error submitting review:", error);
                alert("Error submitting review. Please try again.");
            }
        }
        
        async function loadReviews() {
            const reviewsList = document.getElementById('reviewsList');
            reviewsList.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading reviews...</p></div>';
            
            try {
                // Get latest 30 reviews
                const snapshot = await db.collection('reviews')
                    .orderBy('timestamp', 'desc')
                    .limit(30)
                    .get();
                
                allReviews = [];
                snapshot.forEach(doc => {
                    allReviews.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                document.getElementById('reviewCount').innerText = allReviews.length + ' Reviews';
                
                if (allReviews.length === 0) {
                    reviewsList.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-comment-dots"></i>
                            <p>No reviews yet. Be the first to review!</p>
                        </div>
                    `;
                    return;
                }
                
                reviewsList.innerHTML = '';
                
                allReviews.forEach((review) => {
                    const date = review.timestamp ? review.timestamp.toDate().toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    }) : 'Recently';
                    
                    const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                    
                    const reviewCard = document.createElement('div');
                    reviewCard.className = 'review-card';
                    reviewCard.innerHTML = `
                        <div class="review-header">
                            <span class="reviewer-name"><i class="fas fa-user-circle"></i> ${escapeHtml(review.name)}</span>
                            <span class="review-date">${escapeHtml(date)}</span>
                        </div>
                        <div class="review-rating">
                            ${stars}
                        </div>
                        <div class="review-text">
                            "${escapeHtml(review.review)}"
                        </div>
                    `;
                    reviewsList.appendChild(reviewCard);
                });
                
            } catch (error) {
                console.error("Error loading reviews:", error);
                reviewsList.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading reviews</p>
                    </div>
                `;
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Auto refresh orders every 30 seconds
        let refreshInterval;
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                loadAllOrders();
                loadReviews();
            }, 30000);
        }
        
        window.onload = () => {
            loadAllOrders();
            loadReviews();
            startAutoRefresh();
        };
    </script>
</body>
</html>
